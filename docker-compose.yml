# SecureFlow — local development compose file.
#
# NOTE ON "Database" as a compose service: SecureFlow's database is a
# hosted Supabase Postgres project, not something this repo runs itself —
# there's no local Postgres container here. If you want a fully offline
# dev loop (no network dependency on Supabase at all), that's a separate,
# bigger decision — see the chat message this shipped with. As shipped,
# both services just point at your real Supabase project via env vars,
# same as running them without Docker.
#
# Usage (first time only):
#   1. Run ./setup.sh (macOS/Linux) or .\setup.ps1 (Windows) once — it
#      creates backend/.env.docker and secureflow/.env.docker from the
#      committed .env.docker.example templates (skips files that already
#      exist, never overwrites your real values).
#   2. Fill in the real values in those two files (Supabase URL/keys, etc).
#   3. docker compose up --build
#
# Every run after that is just step 3.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      - PORT=8000
    volumes:
      # Mount source for live-reload during local dev. Remove this if you
      # want the container to run purely on what was baked in at build time.
      - ./backend:/app
      # The bind mount above brings the host's backend/.env (Windows local
      # dev file, with ZAP_PATH pointed at a Windows zap.bat) into the
      # container as /app/.env. main.py's load_dotenv() then picks that up
      # and overrides ZAP auto-discovery, breaking DAST scans in Docker.
      # An anonymous volume can't mask a single file (only directories,
      # like the node_modules trick below), so instead bind-mount
      # .env.docker itself directly over /app/.env, read-only — this
      # guarantees the container only ever sees the Docker-safe env file,
      # never the host's local one.
      - ./backend/.env.docker:/app/.env:ro
      # Persists Trivy's vuln DB across container rebuilds/restarts —
      # without this, every `docker compose up --build` wiped the cache
      # and the next scan had to re-download the DB from ghcr.io from
      # scratch, which is what was causing the 429 rate-limit errors and
      # the multi-minute scan times. Independent of the ./backend bind
      # mount above since it lives outside /app.
      - trivy-cache:/home/appuser/.cache/trivy
      # Trivy checks ~/.m2/repository before hitting Maven Central for
      # Java/pom.xml dependency resolution — separate from trivy-cache
      # above (which only holds the vuln DB, not Maven POMs).
      # IMPORTANT: do not populate this by running `mvn` inside this
      # backend container against arbitrary uploaded/GitHub repos — Maven
      # executes project-defined plugins/build extensions, so that would
      # run untrusted build code in the main application container. Only
      # populate this volume from a separate, controlled pre-warming
      # environment (a CI job, a throwaway container) that resolves a
      # known/trusted repo's dependencies, then copy the result in.
      - maven-cache:/home/appuser/.m2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./secureflow
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./secureflow/.env.docker
    environment:
      # NOT http://backend:8000 — that's Docker's internal DNS name, which
      # only resolves container-to-container. The dashboard routes
      # (dashboard.findings.tsx, dashboard.reports.tsx, dashboard.settings.tsx)
      # are plain client components — their fetch calls run in your browser,
      # which can't see Docker's internal network at all. Since
      # docker-compose.yml maps the backend's port 8000 straight to the host
      # (see the backend service's `ports:`), localhost:8000 is what your
      # browser can actually reach.
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./secureflow:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trivy-cache:
  maven-cache: